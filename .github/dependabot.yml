version: 2
updates:
  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"

  # CRM Laravel / PHP (Composer)
  - package-ecosystem: "composer"
    directory: "/crm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      composer-crm:
        patterns:
          - "*"

  # CRM Vue / Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/crm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-crm:
        patterns:
          - "*"

  # OCR Service (Python / pip)
  - package-ecosystem: "pip"
    directory: "/ocr"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      pip-ocr:
        patterns:
          - "*"

  # Docker Base Images (CRM)
  - package-ecosystem: "docker"
    directory: "/crm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      docker-crm:
        patterns:
          - "*"

  # Docker Base Images (Calc)
  - package-ecosystem: "docker"
    directory: "/calc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      docker-calc:
        patterns:
          - "*"

  # Docker Base Images (OCR)
  - package-ecosystem: "docker"
    directory: "/ocr"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      docker-ocr:
        patterns:
          - "*"
