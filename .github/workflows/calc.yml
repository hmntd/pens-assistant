name: Calc CI

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'calc/**'
      - 'protos/**'
  pull_request:
    paths:
      - 'calc/**'
      - 'protos/**'

permissions:
  contents: read

jobs:
  calc-build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./calc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            g++ \
            libgtest-dev \
            libgrpc++-dev \
            protobuf-compiler-grpc \
            libprotobuf-dev \
            libpq-dev \
            libpqxx-dev \
            pkg-config

      - name: Generate Protobuf & gRPC C++ Code
        run: |
          protoc -I=../protos --cpp_out=src --grpc_out=src --plugin=protoc-gen-grpc=$(which grpc_cpp_plugin) ../protos/calc.proto

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          if [ -f build/unit_calculator_tests ]; then
            ./build/unit_calculator_tests
          fi
          if [ -f build/unit_repository_tests ]; then
            ./build/unit_repository_tests
          fi

      - name: Run Feature Tests
        run: |
          if [ -f build/feature_grpc_tests ]; then
            ./build/feature_grpc_tests
          fi