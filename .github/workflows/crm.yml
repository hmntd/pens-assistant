name: CRM CI

on:
  push:
    paths:
      - 'crm/**'
  pull_request:
    paths:
      - 'crm/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./crm
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, phpstan
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (PHP)
        run: composer update --prefer-dist --no-progress --no-suggest --quiet

      - name: Build Frontend Assets
        run: |
          npm install
          npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run PHPStan (Static Analysis)
        run: phpstan analyse --level=5 app/

      - name: Run Tests (PHPUnit)
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'