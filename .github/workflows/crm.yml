name: CRM CI

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'crm/**'
  pull_request:
    paths:
      - 'crm/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./crm
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer, phpstan
          extensions: grpc, protobuf
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'crm/package-lock.json'

      - name: Install Dependencies (PHP)
        run: composer install --no-interaction --prefer-dist

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --level=5 --memory-limit=1G app/

      - name: Run Tests (PHPUnit)
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'