apiVersion: v1
kind: Secret
metadata:
  name: pens-assistant-secrets
  namespace: pens-assistant
  labels:
    app.kubernetes.io/part-of: pens-assistant
type: Opaque
stringData:
  # Copy this file to deploy/k8s/secret.yaml (which is gitignored) and fill in real values,
  # OR generate the secret directly from your .env file:
  #   kubectl create secret generic pens-assistant-secrets --from-env-file=crm/.env -n pens-assistant
  APP_KEY: "base64:GENERATE_WITH_PHP_ARTISAN_KEY_GENERATE"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  CALC_DB_PASSWORD: "CHANGE_ME_CALC_DB_PASSWORD"
  REDIS_PASSWORD: "null"
  REVERB_APP_KEY: "CHANGE_ME_REVERB_KEY"
  REVERB_APP_SECRET: "CHANGE_ME_REVERB_SECRET"

  # Optional Notification & OAuth Provider Secrets
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  TELEGRAM_BOT_TOKEN: ""
  SMS_GATEWAY_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""

