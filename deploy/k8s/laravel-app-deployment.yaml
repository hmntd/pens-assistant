apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laravel-storage-pvc
  namespace: pens-assistant
  labels:
    app: laravel-app
    app.kubernetes.io/part-of: pens-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-app
  namespace: pens-assistant
  labels:
    app: laravel-app
    app.kubernetes.io/part-of: pens-assistant
spec:
  type: ClusterIP
  selector:
    app: laravel-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  namespace: pens-assistant
  labels:
    app: laravel-app
    app.kubernetes.io/part-of: pens-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
        app.kubernetes.io/part-of: pens-assistant
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: sync-public-assets
          image: pens-assistant-crm:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              cp -R /var/www/public/. /shared-public/
              mkdir -p /var/www/storage/app/public \
                       /var/www/storage/framework/cache/data \
                       /var/www/storage/framework/sessions \
                       /var/www/storage/framework/views \
                       /var/www/storage/logs
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: public-assets
              mountPath: /shared-public
            - name: laravel-storage
              mountPath: /var/www/storage
        - name: laravel-migrate
          image: pens-assistant-crm:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until php -r "new PDO('pgsql:host=' . getenv('DB_HOST') . ';port=' . getenv('DB_PORT') . ';dbname=' . getenv('DB_DATABASE'), getenv('DB_USERNAME'), getenv('DB_PASSWORD'));" >/dev/null 2>&1; do
                echo "Waiting for PostgreSQL database crm-db..."
                sleep 2
              done
              php artisan migrate --force
          envFrom:
            - configMapRef:
                name: pens-assistant-config
            - secretRef:
                name: pens-assistant-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/storage
      containers:
        - name: php-fpm
          image: pens-assistant-crm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pens-assistant-config
            - secretRef:
                name: pens-assistant-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/storage
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          lifecycle:
            preStop:
              exec:
                command: ["/usr/sbin/nginx", "-s", "quit"]
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: public-assets
              mountPath: /var/www/public
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: public-assets
          emptyDir: {}
        - name: laravel-storage
          persistentVolumeClaim:
            claimName: laravel-storage-pvc
        - name: nginx-config
          configMap:
            name: nginx-k8s-config

