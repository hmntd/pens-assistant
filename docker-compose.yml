name: pens-assistant

services:
  webserver:
    image: nginx:alpine
    container_name: pens_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./crm:/var/www
      - ./nginx/conf.d/${NGINX_CONF:-app.local.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_PATH:-./nginx/conf.d}:/etc/letsencrypt:ro
    depends_on:
      - crm
      - crm_reverb
    networks:
      - pens_net

  crm:
    build:
      context: .
      dockerfile: crm/Dockerfile
    container_name: pens_crm
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./crm:/var/www
      - ${STORAGE_PATH:-./crm/storage}:/var/www/storage
      - ./protos:/var/www/protos
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: crm_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CALC_GRPC_HOST: calc:50051
      OCR_GRPC_HOST: ocr:50052
    depends_on:
      crm_db:
        condition: service_healthy
      redis:
        condition: service_started
      calc:
        condition: service_started
      ocr:
        condition: service_started
    networks:
      - pens_net

  crm_horizon:
    build:
      context: .
      dockerfile: crm/Dockerfile
    container_name: pens_crm_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./crm:/var/www
      - ${STORAGE_PATH:-./crm/storage}:/var/www/storage
      - ./protos:/var/www/protos
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: crm_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CALC_GRPC_HOST: calc:50051
      OCR_GRPC_HOST: ocr:50052
    depends_on:
      crm:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - pens_net

  crm_reverb:
    image: pens-assistant-crm
    container_name: pens_crm_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./crm:/var/www
      - ${STORAGE_PATH:-./crm/storage}:/var/www/storage
      - ./protos:/var/www/protos
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: crm_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      crm:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - pens_net

  redis:
    image: redis:alpine
    container_name: pens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pens_net

  crm_db:
    image: postgres:16-alpine
    container_name: pens_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-crm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pens_net

  calc:
    build:
      context: .
      dockerfile: calc/Dockerfile
    container_name: pens_calc
    restart: unless-stopped
    ports:
      - "50051:50051"
    volumes:
      - ./calc:/app
      - ./protos:/app/protos
      - /app/build
    environment:
      DB_HOST: calc_db
      DB_PORT: 5432
      DB_NAME: ${CALC_DB_DATABASE:-calc_db}
      DB_USER: ${CALC_DB_USERNAME:-postgres}
      DB_PASSWORD: ${CALC_DB_PASSWORD:-password}
      DB_CONNECTION_STRING: "host=calc_db port=5432 user=${CALC_DB_USERNAME:-postgres} password=${CALC_DB_PASSWORD:-password} dbname=${CALC_DB_DATABASE:-calc_db} sslmode=disable"
    depends_on:
      calc_db:
        condition: service_healthy
    networks:
      - pens_net

  calc_db:
    image: postgres:16-alpine
    container_name: pens_calc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CALC_DB_DATABASE:-calc_db}
      POSTGRES_USER: ${CALC_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CALC_DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - calc_db_data:/var/lib/postgresql/data
      - ./calc/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALC_DB_USERNAME:-postgres} -d ${CALC_DB_DATABASE:-calc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pens_net

  ocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile
    container_name: pens_ocr
    restart: unless-stopped
    ports:
      - "50052:50052"
    volumes:
      - ./ocr:/app/ocr
      - ./protos:/app/protos
    networks:
      - pens_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: pens_cadvisor
    restart: unless-stopped
    command: -url_base_prefix=/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - pens_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pens_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=http://localhost/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
    networks:
      - pens_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pens_grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/custom
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pens_net

networks:
  pens_net:
    driver: bridge

volumes:
  crm_db_data:
  calc_db_data:
  prometheus_data:
  grafana_data: