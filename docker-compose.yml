name: pens-assistant

services:
  webserver:
    image: nginx:alpine
    container_name: pens_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./crm:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - crm
    networks:
      - pens_net

  crm:
    build:
      context: .
      dockerfile: crm/Dockerfile
    container_name: pens_crm
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./crm:/var/www
      - ./protos:/var/www/protos
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: crm_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CALC_GRPC_HOST: calc:50051
      OCR_GRPC_HOST: ocr:50052
    depends_on:
      crm_db:
        condition: service_healthy
      redis:
        condition: service_started
      calc:
        condition: service_started
      ocr:
        condition: service_started
    networks:
      - pens_net

  crm_horizon:
    build:
      context: .
      dockerfile: crm/Dockerfile
    container_name: pens_crm_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./crm:/var/www
      - ./protos:/var/www/protos
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: crm_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CALC_GRPC_HOST: calc:50051
      OCR_GRPC_HOST: ocr:50052
    depends_on:
      crm:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - pens_net

  redis:
    image: redis:alpine
    container_name: pens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pens_net

  crm_db:
    image: postgres:16-alpine
    container_name: pens_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-crm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pens_net

  calc:
    build:
      context: .
      dockerfile: calc/Dockerfile
    container_name: pens_calc
    restart: unless-stopped
    ports:
      - "50051:50051"
    volumes:
      - ./calc:/app
      - ./protos:/app/protos
    environment:
      DB_CONNECTION_STRING: "host=calc_db port=5432 user=${CALC_DB_USERNAME:-postgres} password=${CALC_DB_PASSWORD:-password} dbname=${CALC_DB_DATABASE:-calc_db} sslmode=disable"
    depends_on:
      calc_db:
        condition: service_healthy
    networks:
      - pens_net

  calc_db:
    image: postgres:16-alpine
    container_name: pens_calc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CALC_DB_DATABASE:-calc_db}
      POSTGRES_USER: ${CALC_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CALC_DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - calc_db_data:/var/lib/postgresql/data
      - ./calc/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALC_DB_USERNAME:-postgres} -d ${CALC_DB_DATABASE:-calc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pens_net

  ocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile
    container_name: pens_ocr
    restart: unless-stopped
    ports:
      - "50052:50052"
    networks:
      - pens_net

networks:
  pens_net:
    driver: bridge

volumes:
  crm_db_data:
  calc_db_data: