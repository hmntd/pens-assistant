syntax = "proto3";

package ocr;

service OcrService {
    rpc RecognizeTaxDocument (OcrRequest) returns (OcrResponse);
}

message OcrRequest {
    bytes file_content = 1;
    string file_extension = 2;
    string document_type = 3;
}

message OcrResponse {
    bool success = 1;
    string raw_text = 2;
    map<string, string> data = 3;
    float confidence = 4;
    string error_message = 5;
}